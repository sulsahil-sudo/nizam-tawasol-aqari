<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تواصل العقاري</title>

<style>
body{
margin:0;
font-family:Tahoma;
background:#f5f7fb;
}

.header{
background:#0f172a;
color:white;
padding:20px;
text-align:center;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
margin:0;
font-size:30px;
color:#2563eb;
}

.nav{
background:white;
padding:15px;
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
}

.nav button{
padding:10px 15px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
<h1>نظام تواصل العقاري</h1>
</div>

<div class="nav">
<button>العقارات</button>
<button>العملاء</button>
<button>الطلبات</button>
<button>الصفقات</button>
<button>التقارير</button>
</div>

<div class="dashboard">

<div class="card">
<h2>0</h2>
<p>العقارات</p>
</div>

<div class="card">
<h2>0</h2>
<p>العملاء</p>
</div>

<div class="card">
<h2>0</h2>
<p>الطلبات</p>
</div>

<div class="card">
<h2>0</h2>
<p>الصفقات</p>
</div>

</div>

</body>
</html>

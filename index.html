<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تواصل العقاري</title>

<style>
body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f5f7fb;
}

.header{
background:#0f172a;
color:white;
padding:20px;
text-align:center;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}
</style>

</head>
<body>

<div style="padding:20px;text-align:center">
<button onclick="showPage('home')">الرئيسية</button>
<button onclick="showPage('properties')">العقارات</button>
<button onclick="showPage('customers')">العملاء</button>
<button onclick="showPage('deals')">الصفقات</button>

</div>
<div id="content" class="card">

<h2>مرحباً بك</h2>
<p>اختر أحد الأقسام من الأعلى</p>

</div>

<script>

document.getElementById("content");

if(page==="home"){
content.innerHTML=`
<h2>الصفحة الرئيسية</h2>
<p>نظام تواصل العقاري</p>
`;
}

function showPage(page){

const content = document.getElementById("content");

if(page==="home"){

content.innerHTML=`
<h2>مرحباً بك</h2>
<p>اختر أحد الأقسام من الأعلى</p>
`;

}

if(page==="properties"){

content.innerHTML=`

<h2>العقارات</h2>

<input id="propertyTitle"
placeholder="عنوان العقار"
style="width:100%;padding:10px;margin:10px 0;">

<input id="propertyPrice"
placeholder="السعر"
style="width:100%;padding:10px;margin:10px 0;">

<button onclick="saveProperty()">
حفظ العقار
</button>

<hr>

<div id="propertiesList"></div>

`;

loadProperties();

}

if(page==="customers"){

content.innerHTML=`
<h2>العملاء</h2>
<p>قسم العملاء</p>
`;

}

if(page==="deals"){

content.innerHTML=`
<h2>الصفقات</h2>
<p>قسم الصفقات</p>
`;

}

}
function saveProperty(){

const title =
document.getElementById("propertyTitle").value;

const price =
document.getElementById("propertyPrice").value;

if(title === "" || price === ""){
alert("أكمل البيانات");
return;
}

let properties =
JSON.parse(
localStorage.getItem("properties")
) || [];

properties.push({
title:title,
price:price
});

localStorage.setItem(
"properties",
JSON.stringify(properties)
);

loadProperties();

document.getElementById("propertyTitle").value="";
document.getElementById("propertyPrice").value="";

}

function loadProperties(){

const list =
document.getElementById("propertiesList");

if(!list) return;

let properties =
JSON.parse(
localStorage.getItem("properties")
) || [];

list.innerHTML="";

properties.forEach(function(item){

list.innerHTML += `
<div style="
background:white;
padding:10px;
margin-top:10px;
border:1px solid #ddd;
border-radius:8px;
">

<b>${item.title}</b>
<br>
السعر: ${item.price} ريال

</div>
`;

});

}
</script>

</body>
</html>

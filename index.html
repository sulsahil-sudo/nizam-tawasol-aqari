<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تواصل العقاري</title>

<style>
body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f5f7fb;
}

.header{
background:#0f172a;
color:white;
padding:20px;
text-align:center;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}
</style>

</head>
<body>

<div style="padding:20px;text-align:center">
<button onclick="showPage('home')">الرئيسية</button>
<button onclick="showPage('properties')">العقارات</button>
<button onclick="showPage('customers')">العملاء</button>
<button onclick="showPage('deals')">الصفقات</button>

</div>
<body>

<div id="content" class="card">

<h2>مرحباً بك</h2>
<p>اختر أحد الأقسام من الأعلى</p>

</div>

<script>

function showPage(page){

const content =
document.getElementById("content");

if(page==="home"){
content.innerHTML=`
<h2>الصفحة الرئيسية</h2>
<p>نظام تواصل العقاري</p>
`;
}

if(page==="properties"){
content.innerHTML=`
<h2>العقارات</h2>

<input
placeholder="عنوان العقار"
style="width:100%;padding:10px;margin:10px 0;">

<input
placeholder="السعر"
style="width:100%;padding:10px;margin:10px 0;">

<button>حفظ العقار</button>
`;
}

}

</script>

</body>
</html>

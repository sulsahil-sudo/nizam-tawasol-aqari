<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مكتب وجه التواصل للعقار</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif}
body{background:linear-gradient(135deg,#1e3c72,#2a5298,#6a3093);min-height:100vh;padding:15px}
.container{background:#fff;max-width:1000px;margin:0 auto;border-radius:16px;padding:25px;box-shadow:0 15px 40px rgba(0,0,0,.3)}
h1{color:#1e3c72;text-align:center;margin-bottom:6px;font-size:22px}
.subtitle{color:#7f8c8d;text-align:center;font-size:13px;margin-bottom:25px}
h3{color:#2c3e50;font-size:16px;border-bottom:2px solid #ecf0f1;padding-bottom:8px;margin-bottom:15px}
.form-group{margin-bottom:15px}
label{display:block;font-weight:bold;color:#34495e;margin-bottom:6px;font-size:14px}
input,select{padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px;width:100%}
button{background:#27ae60;color:#fff;border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:bold;width:100%;cursor:pointer;margin-top:10px}
button:hover{background:#219150}
button:disabled{background:#bdc3c7;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{border:1px solid #e1e5eb;padding:10px;text-align:center}
th{background:#34495e;color:#fff}
tr:nth-child(even){background:#f9fafc}
.msg{padding:12px;border-radius:8px;text-align:center;font-weight:bold;display:none;margin-top:10px}
.msg.ok{background:#d5f5e3;color:#186a3b;display:block}
.msg.err{background:#fadbd8;color:#922b21;display:block}
.match-row{background:#e8f8f5!important}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000;justify-content:center;align-items:center}
.modal-content{background:#fff;padding:25px;border-radius:12px;width:90%;max-width:450px}
.btn-add{background:#3498db;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:bold;width:auto;margin:0}
</style>
</head>
<body>
<div class="container">
  <h1>🏢 مكتب وجه التواصل للعقار</h1>
  <p class="subtitle">إدارة العروض والطلبات العقارية</p>

  <form id="mainForm">
    <h3>➕ تسجيل عرض أو طلب</h3>

    <div class="form-group">
      <label>النوع *</label>
      <select id="type" onchange="toggleFields()" required>
        <option value="offer">🏠 عرض عقار</option>
        <option value="request">🔍 طلب عقار</option>
      </select>
    </div>

    <div class="form-group">
      <label>العميل *</label>
      <div style="display:flex;gap:8px">
        <select id="client_id" required><option value="">-- اختر --</option></select>
        <button type="button" class="btn-add" onclick="openClientModal()">+</button>
      </div>
    </div>

    <div class="form-group">
      <label>نوع العقار *</label>
      <select id="property_type" required><option value="">-- اختر --</option></select>
    </div>

    <div class="row">
      <div class="form-group">
        <label>المدينة *</label>
        <select id="city" onchange="updateDistricts()" required><option value="">-- اختر --</option></select>
      </div>
      <div class="form-group">
        <label>الحي *</label>
        <select id="district" required><option value="">-- اختر --</option></select>
      </div>
    </div>

    <div class="row">
      <div class="form-group"><label>الغرف</label><input type="number" id="rooms" min="0"></div>
      <div class="form-group"><label>المساحة (م²)</label><input type="number" id="area" min="0"></div>
    </div>

    <div id="offerPriceGroup" class="form-group">
      <label>السعر *</label>
      <input type="number" id="price" min="0">
    </div>

    <div class="row" id="requestBudgetGroup" style="display:none">
      <div class="form-group"><label>من *</label><input type="number" id="budget_min" min="0"></div>
      <div class="form-group"><label>إلى *</label><input type="number" id="budget_max" min="0"></div>
    </div>

    <div class="form-group">
      <label>وضع المطابقة</label>
      <select id="matching_mode"><option value="instant">فوري</option><option value="manual">يدوي</option></select>
    </div>

    <button type="submit" id="submitBtn">💾 حفظ</button>
    <div class="msg" id="msg"></div>
  </form>

  <h3 style="margin-top:30px">📋 أحدث السجلات</h3>
  <table><thead><tr><th>#</th><th>النوع</th><th>العميل</th><th>العقار</th><th>المدينة/الحي</th><th>السعر</th></tr></thead>
  <tbody id="entriesBody"><tr><td colspan="6">جاري التحميل...</td></tr></tbody></table>

  <h3 style="margin-top:30px">🎯 نتائج المطابقة</h3>
  <table><thead><tr><th>#</th><th>نوع العقار</th><th>المدينة/الحي</th><th>السعر</th></tr></thead>
  <tbody id="matchBody"><tr><td colspan="4">لا توجد نتائج</td></tr></tbody></table>
</div>

<!-- نافذة العميل -->
<div id="clientModal" class="modal">
  <div class="modal-content">
    <h3>➕ عميل جديد</h3>
    <div class="form-group"><label>الاسم *</label><input type="text" id="new_c_name"></div>
    <div class="form-group"><label>الجوال</label><input type="text" id="new_c_phone"></div>
    <button onclick="saveNewClient()" style="background:#3498db">حفظ العميل</button>
    <button onclick="closeClientModal()" style="background:#e74c3c;margin-top:8px">إغلاق</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// الرابط والمفتاح الخاص بمشروعك الجديد
const SUPABASE_URL = 'https://nqbqvuplbawdhlwikkpf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XuJkNWlXFHBIsD9u9cj9pg_Ps6Bc1r0';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let DB = { clients: [], property_types: [], cities_districts: [] };

// تحميل القوائم
async function loadData() {
  // 1. العملاء
  const { data: clients, error: err1 } = await supabase.from('clients').select('*').order('name');
  if (err1) console.error('خطأ العملاء:', err1);
  DB.clients = clients || [];
  refreshClientsSelect();

  // 2. أنواع العقارات
  const { data: types, error: err2 } = await supabase.from('property_types').select('*');
  if (err2) console.error('خطأ العقارات:', err2);
  DB.property_types = types || [];
  document.getElementById('property_type').innerHTML = '<option value="">-- اختر --</option>' +
    DB.property_types.map(t => `<option value="${t.name}">${t.name}</option>`).join('');

  // 3. المدن والأحياء
  const { data: cd, error: err3 } = await supabase.from('cities_districts').select('*');
  if (err3) console.error('خطأ المدن:', err3);
  DB.cities_districts = cd || [];
  const uniqueCities = [...new Set(DB.cities_districts.map(c => c.city_name))];
  document.getElementById('city').innerHTML = '<option value="">-- اختر --</option>' +
    uniqueCities.map(c => `<option value="${c}">${c}</option>`).join('');
    
  await loadEntries();
}

function refreshClientsSelect() {
  document.getElementById('client_id').innerHTML = '<option value="">-- اختر --</option>' +
    DB.clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

function updateDistricts() {
  const city = document.getElementById('city').value;
  const districts = DB.cities_districts.filter(c => c.city_name === city).map(c => c.district_name);
  document.getElementById('district').innerHTML = '<option value="">-- اختر --</option>' +
    districts.map(d => `<option>${d}</option>`).join('');
}

function toggleFields() {
  const t = document.getElementById('type').value;
  document.getElementById('offerPriceGroup').style.display = t === 'offer' ? 'block' : 'none';
  document.getElementById('requestBudgetGroup').style.display = t === 'request' ? 'grid' : 'none';
}

function showMsg(text, ok = true, elId = 'msg') {
  const m = document.getElementById(elId);
  m.textContent = text;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  setTimeout(() => m.className = 'msg', 3000);
}

// حفظ عميل جديد
function openClientModal() { document.getElementById('clientModal').style.display='flex'; }
function closeClientModal() { document.getElementById('clientModal').style.display='none'; }

async function saveNewClient() {
  const name = document.getElementById('new_c_name').value.trim();
  if (!name) return alert('اكتب الاسم');
  
  const { data, error } = await supabase.from('clients').insert([{
    name: name,
    phone: document.getElementById('new_c_phone').value
  }]).select();
  
  if (error) return alert('خطأ: ' + error.message);
  
  DB.clients.push(data[0]);
  refreshClientsSelect();
  document.getElementById('client_id').value = data[0].id;
  closeClientModal();
  alert('✅ تم حفظ العميل');
}

// حفظ عرض/طلب
document.getElementById('mainForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const type = document.getElementById('type').value;
  const clientId = document.getElementById('client_id').value;
  
  if (!clientId) return showMsg('اختر العميل', false);

  const payload = {
    client_id: parseInt(clientId),
    type: type,
    property_type: document.getElementById('property_type').value,
    city: document.getElementById('city').value,
    district: document.getElementById('district').value,
    rooms: parseInt(document.getElementById('rooms').value) || null,
    area: parseFloat(document.getElementById('area').value) || null,
    status: 'جديد',
    matching_mode: document.getElementById('matching_mode').value
  };

  if (type === 'offer') payload.price = parseFloat(document.getElementById('price').value) || 0;
  else {
    payload.budget_min = parseFloat(document.getElementById('budget_min').value) || 0;
    payload.budget_max = parseFloat(document.getElementById('budget_max').value) || 0;
  }

  this.querySelector('button').textContent = 'جاري الحفظ...';
  this.querySelector('button').disabled = true;

  const { data, error } = await supabase.from('listings_requests').insert([payload]).select();

  this.querySelector('button').textContent = '💾 حفظ';
  this.querySelector('button').disabled = false;

  if (error) return showMsg('❌ ' + error.message, false);

  showMsg('✅ تم الحفظ بنجاح');
  this.reset();
  toggleFields();
  await loadEntries();

  // إذا كان طلب ومطابقة فورية
  if (type === 'request' && payload.matching_mode === 'instant' && data[0]) {
    await runMatching(data[0].id);
  }
});

// تحميل السجلات
async function loadEntries() {
  const { data, error } = await supabase.from('listings_requests').select('*, clients(name)').order('created_at', { ascending: false }).limit(20);
  const tbody = document.getElementById('entriesBody');
  
  if (error || !data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="6">لا توجد سجلات</td></tr>';
    return;
  }
  
  tbody.innerHTML = data.map(r => {
    const priceTxt = r.type === 'offer' 
      ? (r.price ? r.price.toLocaleString('ar-SA') + ' ريال' : '-') 
      : `من ${r.budget_min} إلى ${r.budget_max}`;
    return `<tr>
      <td>#${r.id}</td>
      <td>${r.type === 'offer' ? '🏠 عرض' : '🔍 طلب'}</td>
      <td>${r.clients?.name || '-'}</td>
      <td>${r.property_type}</td>
      <td>${r.city} - ${r.district}</td>
      <td>${priceTxt}</td>
    </tr>`;
  }).join('');
}

// مطابقة
async function runMatching(requestId) {
  const { data, error } = await supabase.rpc('match_request_to_offers', { p_request_id: requestId });
  const tbody = document.getElementById('matchBody');
  
  if (error) {
    tbody.innerHTML = `<tr><td colspan="4">❌ ${error.message}</td></tr>`;
    return;
  }
  
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="4">لا توجد مطابقة</td></tr>';
    return;
  }
  
  tbody.innerHTML = data.map(m => `
    <tr class="match-row">
      <td>#${m.offer_id}</td>
      <td>${m.property_type}</td>
      <td>${m.city} - ${m.district}</td>
      <td>${Number(m.price).toLocaleString('ar-SA')} ريال</td>
    </tr>
  `).join('');
}

// تشغيل
loadData();
</script>
</body>
</html>

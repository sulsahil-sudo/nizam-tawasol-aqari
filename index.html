<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تجربة الأزرار</title>
<style>
  body { font-family: Tahoma; text-align: center; padding: 50px; background: #f4f6f9; }
  .box { display: none; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-top: 20px; }
  .active { display: block; }
  button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; color: white; }
  .btn1 { background: #2980b9; }
  .btn2 { background: #27ae60; }
  .btn-back { background: #7f8c8d; font-size: 14px; padding: 10px 20px;}
</style>
</head>
<body>

  <h1>اختبار الأزرار</h1>
  <p>اضغط على أي زر، إذا ظهرت شاشة جديدة يعني الأزرار سليمة.</p>

  <button class="btn1" onclick="show('screen1')">فتح شاشة 1</button>
  <button class="btn2" onclick="show('screen2')">فتح شاشة 2</button>

  <div id="screen1" class="box">
    <h2>أنت الآن في شاشة 1</h2>
    <button class="btn-back" onclick="show('home')">رجوع</button>
  </div>

  <div id="screen2" class="box">
    <h2>أنت الآن في شاشة 2</h2>
    <button class="btn-back" onclick="show('home')">رجوع</button>
  </div>

  <script>
    function show(id) {
      // إخفاء كل الشاشات
      document.querySelectorAll('.box').forEach(function(box) {
        box.classList.remove('active');
      });
      
      // إذا كان المطلوب هو "الرئيسية"، لا نظهر شيء
      if (id !== 'home') {
        // إظهار الشاشة المطلوبة
        document.getElementById(id).classList.add('active');
      }
    }
  </script>
</body>
</html>
